{% extends "base.html" %}

{% block title %}Удалить отзыв{% endblock %}

{% block content %}
<section class="reviews">
  <div class="container" style="max-width: 600px; margin-top: 24px;">
    <h1 class="page-title">Удалить отзыв</h1>
    <p>Вы уверены, что хотите удалить отзыв от «{{ object.full_name }}»?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn-green">Да, удалить</button>
      <a href="{% url 'reviews' %}" class="btn-outline">Отмена</a>
    </form>
  </div>
</section>
{% endblock %}
